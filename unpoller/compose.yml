name: unpoller

services:
  unpoller:
    image: ghcr.io/unpoller/unpoller:latest
    container_name: unpoller
    restart: unless-stopped
    environment:
      UP_UNIFI_DEFAULT_URL: https://unifi.alexandcarmen.com
      UP_UNIFI_DEFAULT_USER: ${UNIFI_USER}
      UP_UNIFI_DEFAULT_PASS: ${UNIFI_PASS}
      UP_UNIFI_DEFAULT_VERIFY_SSL: "true"
      UP_PROMETHEUS_DISABLE: "true"
      UP_INFLUXDB_DISABLE: "true"
      UP_DATADOG_ENABLE: "true"
      UP_DATADOG_ADDRESS: dd-agent:8125
      UP_DATADOG_INTERVAL: 1m
    networks:
      - monitoring

networks:
  monitoring:
    name: monitoring
    external: true
