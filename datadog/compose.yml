services:
  dd-agent:
    image: registry.datadoghq.com/agent:7
    container_name: dd-agent
    restart: unless-stopped
    environment:
      DD_API_KEY: ${DD_API_KEY}
      DD_SITE: datadoghq.com
      DD_DOGSTATSD_NON_LOCAL_TRAFFIC: "true"
      DD_LOGS_ENABLED: "true"
      DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL: "true"
      DD_CONTAINER_EXCLUDE_LOGS: name:dd-agent
      DD_PROCESS_AGENT_CONTAINER_COLLECTION_ENABLED: "true"
      DD_PROCESS_AGENT_PROCESS_COLLECTION_ENABLED: "true"
      DD_RUNTIME_SECURITY_CONFIG_ENABLED: "true"
      HOST_PROC: /host/proc
      HOST_SYS: /host/sys
      HOST_ROOT: /host/root
    ports:
      - "2055:2055/udp"   # NetFlow
    volumes:
      - /mnt/storage/appdata/datadog/run:/opt/datadog-agent/run:rw
      - ./datadog.yaml:/etc/datadog-agent/datadog.yaml:ro
      - ./system-probe.yaml:/etc/datadog-agent/system-probe.yaml:ro
      - ./conf.d/backup.d:/etc/datadog-agent/conf.d/backup.d:ro
      - ./conf.d/docker.d:/etc/datadog-agent/conf.d/docker.d:ro
      - ./conf.d/linux.d:/etc/datadog-agent/conf.d/linux.d:ro
      - /etc/passwd:/etc/passwd:ro
      - /etc/group:/etc/group:ro
      - /:/host/root:ro
      - /sys/kernel/debug:/sys/kernel/debug
      - /sys/kernel/security:/host/sys/kernel/security
      - /etc/os-release:/etc/os-release
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc:/host/proc:ro
      - /sys/fs/cgroup:/host/sys/fs/cgroup:ro
      - /mnt/.ix-apps/docker/containers:/var/lib/docker/containers:ro
    security_opt:
      - apparmor:unconfined
    pid: host
    cap_add:
      - SYS_ADMIN
      - SYS_RESOURCE
      - SYS_PTRACE
      - NET_ADMIN
      - NET_BROADCAST
      - NET_RAW
      - IPC_LOCK
      - CHOWN
      - KILL
