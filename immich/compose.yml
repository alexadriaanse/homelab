name: immich

services:
  immich-server:
    image: ghcr.io/immich-app/immich-server:release
    container_name: immich-server
    restart: unless-stopped
    volumes:
      - /mnt/storage/media/immich:/data
      - /mnt/storage/media/photos:/mnt/media/photos:ro
      - /etc/localtime:/etc/localtime:ro
    environment:
      DB_HOSTNAME: immich-postgres
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: immich-redis
      IMMICH_MACHINE_LEARNING_URL: http://immich-machine-learning:3003
    networks:
      - default
      - proxy
    depends_on:
      immich-postgres:
        condition: service_healthy
      immich-redis:
        condition: service_healthy
    healthcheck:
      disable: false

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:release
    container_name: immich-machine-learning
    restart: unless-stopped
    volumes:
      - /mnt/storage/appdata/immich/model-cache:/cache
    environment:
      MACHINE_LEARNING_WORKERS: "8"
      MACHINE_LEARNING_WORKER_TIMEOUT: "120"
    healthcheck:
      disable: false

  immich-postgres:
    # Verify this tag matches the official docker-compose.yml at
    # https://github.com/immich-app/immich/releases/latest
    image: ghcr.io/immich-app/postgres:18-vectorchord0.5.3-pgvector0.8.1
    container_name: immich-postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - /mnt/storage/appdata/postgres/immich:/var/lib/postgresql
    command: >
      postgres
      -c shared_preload_libraries=vchord.so,pg_stat_statements
      -c 'search_path="$$user", public, vectors'
      -c max_wal_size=2GB
      -c shared_buffers=8GB
      -c effective_cache_size=32GB
      -c maintenance_work_mem=2GB
      -c track_activity_query_size=4096
    networks:
      - default
      - monitoring
    healthcheck:
      test: pg_isready --dbname=${POSTGRES_DB} --username=${POSTGRES_USER}
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  immich-redis:
    image: docker.io/valkey/valkey:9
    container_name: immich-redis
    restart: unless-stopped
    healthcheck:
      test: valkey-cli ping
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  proxy:
    name: proxy
    external: true
  monitoring:
    name: monitoring
    external: true
